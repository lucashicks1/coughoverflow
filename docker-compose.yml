services:
  db:
    image: postgres
    container_name: db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U administrator -d cough_db"]
      interval: 5s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=verySecretPassword
      - POSTGRES_USER=administrator
      - POSTGRES_DB=cough_db
    ports:
      - 5432:5432
  
  backend:
    build: .
    ports:
      - 8080:8080
    environment:
      - DB_URL=postgresql://administrator:verySecretPassword@db:5432/cough_db
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  db-data: