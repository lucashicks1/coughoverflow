services:
  db:
    image: postgres
    container_name: db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U administrator -d cough_db" ]
      interval: 5s
      retries: 5
      start_period: 20s
      timeout: 10s
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=verySecretPassword
      - POSTGRES_USER=administrator
      - POSTGRES_DB=cough_db
    ports:
      - 5432:5432

  backend:
    build: 
      context: api
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://administrator:verySecretPassword@db:5432/cough_db
      - QUEUE_TYPE=sqs
      - AWS_REGION=us-east-1
      - AWS_SQS_URL=main
      - AWS_SQS_URL_URGENT=main_urgent
    depends_on:
      db:
        condition: service_healthy
        restart: true
  worker:
    build:
      context: worker
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://administrator:verySecretPassword@db:5432/cough_db
      - AWS_REGION=us-east-1
      - AWS_SQS_URL=main
      - AWS_SQS_URL_URGENT=main_urgent
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  db-data: