[project]
name = "Cough_Overflow"
version = "0.1.0"
description = "Cloud Functionality Assignment for CSSE6400"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.115.11", "pydantic-settings>=2.8.1"]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = ["B008"]


[tool.mypy]
enable_incomplete_feature = "NewGenericSyntax"
