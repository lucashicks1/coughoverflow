[project]
name = "Cough_Overflow"
version = "0.1.0"
description = "Cloud Functionality Assignment for CSSE6400"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=2.21.1",
    "aiofiles>=24.1.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.11",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.8.1",
    "pyrfc3339>=2.0.1",
    "rq>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.39",
    "types-aiofiles>=24.1.0.20250326",
    "types-pyrfc3339>=2.0.1.20241107",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = ["B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"src/cough_overflow/api/analysis.py" = ["EM101"]

[tool.mypy]
enable_incomplete_feature = "NewGenericSyntax"

[dependency-groups]
dev = ["mypy>=1.15.0"]
